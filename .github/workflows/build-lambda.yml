name: Build verified Lambda ZIP

# Manual only: no AWS credentials, deployment, provider calls or automatic runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline regression suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build and validate complete SDK package
        run: python -m tools.build_lambda --output-dir dist --require-python312
      - name: Publish ZIP, checksum, manifest and exact dependency wheels
        uses: actions/upload-artifact@v4
        with:
          name: auditor-lambda-python312-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 7
